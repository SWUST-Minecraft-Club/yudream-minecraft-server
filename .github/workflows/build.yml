name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: python3 ./scripts/check-release.py
      - name: Native UI dependencies
        if: ${{ hashFiles('native/CMakeLists.txt') != '' }}
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libfreetype6-dev
      - run: ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ github.sha }}
          path: |
            ./build/libs/*.jar
            ./build/distributions/*
            ./server/build/libs/*.jar
            ./release/**/*.jar
          if-no-files-found: error
