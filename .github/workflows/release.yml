name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<version> tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check exact tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          python3 ./scripts/check-release.py --tag "$RELEASE_TAG"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Native UI dependencies
        if: ${{ hashFiles('native/CMakeLists.txt') != '' }}
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libfreetype6-dev
      - run: ./gradlew build --no-daemon --stacktrace
      - name: Publish artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 ./scripts/prepare-release.py
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./build/publish/* --clobber
          else
            gh release create "$RELEASE_TAG" ./build/publish/* --verify-tag --title "$RELEASE_TAG" --notes-file ./CHANGELOG.md "${flags[@]}"
          fi
